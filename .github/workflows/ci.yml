name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-boost:
    name: Boost (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    env:
      BOOST_VERSION: boost-1.82.0

    steps:
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-recommends g++-multilib

      - name: Download Boost
        shell: bash
        run: |
          curl -fsSL https://github.com/boostorg/boost/releases/download/${BOOST_VERSION}/${BOOST_VERSION}.tar.gz -o boost.tar.gz
          tar -xzf boost.tar.gz && rm boost.tar.gz
          mv ${BOOST_VERSION} libboost

      # Layout read by src/AMBuilder: dist/include/boost, dist/lib/<arch>.
      - name: Build Boost (Linux)
        if: runner.os == 'Linux'
        working-directory: libboost
        run: |
          ./bootstrap.sh --with-libraries=thread,system
          ./b2 -j8 --prefix="$PWD/dist" --libdir="$PWD/dist/lib/x86" cflags=-m32 cxxflags=-m32 address-model=32 threading=multi architecture=x86 instruction-set=i686 link=static runtime-link=static install
          ./b2 -j8 --build-dir=bin64 --prefix="$PWD/dist" --libdir="$PWD/dist/lib/x86_64" cflags=-fPIC cxxflags=-fPIC address-model=64 threading=multi architecture=x86 link=static runtime-link=static install

      - name: Build Boost (Windows)
        if: runner.os == 'Windows'
        working-directory: libboost
        shell: cmd
        run: |
          call bootstrap.bat || exit /b 1
          b2 -j8 --with-thread --with-system --layout=system --prefix=%CD%\dist --libdir=%CD%\dist\lib\x86 address-model=32 architecture=x86 threading=multi variant=release link=static runtime-link=static define=BOOST_TYPE_INDEX_FORCE_NO_RTTI_COMPATIBILITY install || exit /b 1
          b2 -j8 --with-thread --with-system --layout=system --prefix=%CD%\dist --libdir=%CD%\dist\lib\x86_64 address-model=64 architecture=x86 threading=multi variant=release link=static runtime-link=static define=BOOST_TYPE_INDEX_FORCE_NO_RTTI_COMPATIBILITY install || exit /b 1

      - name: Check Boost
        shell: bash
        working-directory: libboost/dist
        run: |
          test -f include/boost/asio.hpp
          ls -l lib/x86 lib/x86_64

      - name: Upload Boost
        uses: actions/upload-artifact@v7
        with:
          name: boost-${{ matrix.platform }}
          path: libboost/dist
          if-no-files-found: error
          retention-days: 1

  build-release-extension:
    needs: build-boost
    uses: srcdslab/ci-workflows/.github/workflows/shared_build_release_am_extension.yml@v1
    with:
      sdks: "css"
      artifact-path: "boost"
      submodules: "recursive"
